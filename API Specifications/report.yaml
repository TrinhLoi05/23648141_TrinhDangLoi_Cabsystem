openapi: 3.0.3
info:
  title: CAB System - Report API
  version: 1.0.0
  description: API cung cấp các báo cáo hoạt động cơ bản của CAB System.
servers:
- url: http://localhost:3000/api
  description: Local development server
tags:
- name: Report
  description: API cung cấp các báo cáo hoạt động cơ bản của CAB System.
x-functional-requirements:
- id: FR19.01
  business_requirement: BR19
  name: Báo cáo chuyến
  description: Thống kê số lượng chuyến.
  api:
    method: GET
    path: /reports/trips
- id: FR19.02
  business_requirement: BR19
  name: Báo cáo doanh thu
  description: Thống kê doanh thu.
  api:
    method: GET
    path: /reports/revenue
- id: FR19.03
  business_requirement: BR19
  name: Báo cáo hoàn thành
  description: Thống kê tỷ lệ hoàn thành.
  api:
    method: GET
    path: /reports/completion-rate
- id: FR19.04
  business_requirement: BR19
  name: Báo cáo hủy
  description: Thống kê tỷ lệ hủy.
  api:
    method: GET
    path: /reports/cancellation-rate
- id: FR19.05
  business_requirement: BR19
  name: Báo cáo tài xế
  description: Thống kê hiệu quả tài xế.
  api:
    method: GET
    path: /reports/drivers
paths:
  /reports/trips:
    get:
      tags:
      - Report
      summary: Báo cáo số lượng chuyến
      x-fr-ids:
      - FR19.01
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /reports/revenue:
    get:
      tags:
      - Report
      summary: Báo cáo doanh thu
      x-fr-ids:
      - FR19.02
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /reports/completion-rate:
    get:
      tags:
      - Report
      summary: Báo cáo tỷ lệ hoàn thành
      x-fr-ids:
      - FR19.03
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /reports/cancellation-rate:
    get:
      tags:
      - Report
      summary: Báo cáo tỷ lệ hủy
      x-fr-ids:
      - FR19.04
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /reports/drivers:
    get:
      tags:
      - Report
      summary: Báo cáo hiệu quả tài xế
      x-fr-ids:
      - FR19.05
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Thao tác thành công
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Dữ liệu không hợp lệ
